; GUO -- Windows export preset TEMPLATE.
;
; Rendered by tools\windows\run.py into godot\GUO\export_presets.cfg
; (gitignored; the Android and web tools render the same file from their
; own templates, and each tool re-renders before it exports, so the three
; never need to coexist). Edit THIS file to change the preset; never the
; rendered one.
;
; Every key below is one Godot 4.7's Windows export plugin declares
; (platform/windows/export/export_plugin.cpp). The icon is the brand
; sigil, icon.ico, built by tools\brand\run.py; Godot 4.7 writes it into
; the executable's resources itself (no rcedit).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/guo_editor/*"
export_path="{{EXPORT_PATH}}"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; 1 = also export GUO.console.exe, the wrapper that keeps a console window;
; it gets the same icon (application/console_wrapper_icon).
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
; modify_resources is what makes the exporter write the icon and the
; strings below into the .exe. Off, the template's own (engine) icon stays.
application/modify_resources=true
application/icon="res://icon.ico"
application/console_wrapper_icon="res://icon.ico"
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="GUO"
application/file_description="GUO - Ultima Online Classic on Godot"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
