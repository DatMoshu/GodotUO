; GUO -- Android export preset TEMPLATE.
;
; Rendered by tools\android\run.py into godot\GUO\export_presets.cfg, which
; is gitignored: the rendered file carries the keystore path and password
; from launchers\_shared\config.bat, and nothing that comes out of config.bat
; goes into git. Edit THIS file to change the preset; never the rendered one.
;
; Every key below is one Godot 4.7's Android export plugin declares
; (platform/android/export/export_plugin.cpp) or its .NET export plugin
; declares (modules/mono/editor/GodotTools/.../Export/ExportPlugin.cs).
; See ADR-0017 for why each value is what it is.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/backgrounds/*, assets/screensavers/*, postfx/presets/*.json"
exclude_filter="addons/guo_editor/*"
export_path="{{EXPORT_PATH}}"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; No Gradle build: the prebuilt android_debug.apk template is enough for an
; APK, and the .NET side is a dotnet publish the export runs itself. Gradle
; is only needed for an AAB or an Android plugin, neither of which this is.
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; ARM64 only. The .NET export supports arm64 and x86_64 and nothing else,
; and every phone made this decade is arm64.
architectures/armeabi-v7a=false
architectures/arm64-v8a={{ABI_ARM64}}
architectures/x86=false
architectures/x86_64={{ABI_X86_64}}
version/code=1
version/name=""
package/unique_name="{{PACKAGE}}"
package/name="GUO"
package/signed=true
package/app_category=9
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://android_icons/main_192.png"
launcher_icons/adaptive_foreground_432x432="res://android_icons/foreground_432.png"
launcher_icons/adaptive_background_432x432="res://android_icons/background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://android_icons/monochrome_432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/edge_to_edge=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
; The client's command line. A device has no launcher to pass flags, so the
; tool bakes them in here: where the UO data is on the device, and for the
; smoke build the probe flags. See run.py export --args.
command_line/extra_args="{{EXTRA_ARGS}}"
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
; The shard is on the network; nothing else is asked for. The client data
; sits in the app's own external files folder, which needs no permission.
permissions/internet=true
; The haptic tick of a hold-and-flick on a gump (GumpFlick).
permissions/vibrate=true
permissions/read_external_storage=false
permissions/write_external_storage=false
permissions/manage_external_storage=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
dotnet/android_use_linux_bionic=false
keystore/debug="{{KEYSTORE}}"
keystore/debug_user="{{KEYSTORE_USER}}"
keystore/debug_password="{{KEYSTORE_PASSWORD}}"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
