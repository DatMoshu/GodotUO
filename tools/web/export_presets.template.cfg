; GUO -- Web export preset TEMPLATE.
;
; Rendered by tools\web\run.py into godot\GUO\export_presets.cfg (gitignored;
; the Android tool renders the same file from its own template, and each
; tool re-renders before it exports, so the two never need to coexist).
; Edit THIS file to change the preset; never the rendered one.
;
; Every key below is one Godot 4.7's Web export plugin declares
; (platform/web/export/export_plugin.cpp). See ADR-0008 for the state of
; the .NET web export, which is what decides whether this preset can export
; at all.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/backgrounds/*"
exclude_filter="addons/guo_editor/*"
export_path="{{EXPORT_PATH}}"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; No GDExtension on the web build; nothing in the project is one.
variant/extensions_support=false
; Threads: the client is a single-threaded game loop over blocking file
; reads and a socket; the threaded template needs the cross-origin
; isolation headers that run.py serve sends. Keep them on: a Godot web
; export without threads cannot block the way the ported code does.
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; guo_data.js mounts the player's install at /uo before main() (the client
; data layer, ADR-0008 amendment 1); export copies it next to the page.
html/head_include="<script src=\"guo_data.js\"></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
