; GUO -- Linux x86_64 export preset TEMPLATE (the Steam Deck build).
;
; Rendered by tools\steamdeck\run.py into godot\GUO\export_presets.cfg
; (gitignored; the Android, Windows and web tools render the same file
; from their own templates, and each tool re-renders before it exports,
; so the four never need to coexist). Edit THIS file to change the preset;
; never the rendered one.
;
; Every key below is one Godot 4.7's Linux/BSD export plugin declares
; (platform/linuxbsd/export/export_plugin.cpp, on top of the shared PC
; plugin in editor/export/editor_export_platform_pc.cpp) or its .NET export
; plugin declares. See ADR-0018 for why each value is what it is.
;
; The client's command line is NOT baked in here, unlike Android: a Linux
; build takes it from guo.sh, the launcher `push` writes next to it.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/backgrounds/*"
exclude_filter="addons/guo_editor/*"
export_path="{{EXPORT_PATH}}"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; No console wrapper on Linux: the executable is its own terminal program,
; and the Deck's Konsole (or guo.log, when started over ssh) shows its output.
debug/export_console_wrapper=0
; A separate .pck next to the executable, so a data-only change is a small
; push. The .NET data folder sits next to both.
binary_format/embed_pck=false
; The Deck's Van Gogh APU is a desktop GPU: S3TC/BPTC, not ETC2/ASTC.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
; x86_64 is what the Deck is (Zen 2). The template file is
; linux_debug.x86_64 in the mono templates archive.
binary_format/architecture="x86_64"
; Godot's own ssh deploy is off: tools\steamdeck\run.py does the pushing,
; so the host, the key and the install dir come from config.local.bat and
; never from a file that could be committed.
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh="-o ConnectTimeout=10"
ssh_remote_deploy/extra_args_scp="-o ConnectTimeout=10"
ssh_remote_deploy/run_script=""
ssh_remote_deploy/cleanup_script=""
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
