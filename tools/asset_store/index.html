<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUO Asset Store</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101820;color:#ecede7}body{max-width:1180px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #34464d;margin-bottom:30px;padding-bottom:26px}.eyebrow{color:#d8b779;letter-spacing:.15em;font-size:.8rem}h1{font:44px Georgia;margin:12px 0}header p{color:#b8c5c8;max-width:660px;line-height:1.6}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select{font:inherit;padding:12px;border:1px solid #52646a;border-radius:6px;background:#1b2931;color:inherit}input{flex:1;min-width:180px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}article{background:#1a2830;border:1px solid #34464d;border-radius:10px;overflow:hidden}article img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#22373f}article .body{padding:20px}h2{font:24px Georgia;margin:8px 0}small,.meta{color:#b8c5c8}.meta{font-size:.85rem;line-height:1.6}a{display:inline-block;color:#f2d399;margin-top:14px}#status{color:#bdcacc}footer{margin-top:40px;color:#8eaaaf;font-size:.85rem}
</style>
<header><div class="eyebrow">GodotUO</div><h1>Make the world your own.</h1><p>Backgrounds, sounds, themes and profile presets for GUO. Browse community packs, then install from the Store in Options.</p></header>
<div class="toolbar"><input id="search" type="search" placeholder="Search packs or creators" aria-label="Search packs"><select id="kind" aria-label="Filter by kind"><option value="">All kinds</option><option value="background">Backgrounds</option><option value="theme">Themes</option><option value="sound">Sounds</option><option value="profile-preset">Profile presets</option></select></div>
<p id="status" role="status">Loading the collection…</p><main id="cards"></main><footer>GUO Asset Store · Pack licences and creators are shown on every card.</footer>
<script>
const cards=document.querySelector('#cards'),status=document.querySelector('#status'),search=document.querySelector('#search'),kind=document.querySelector('#kind');let packs=[];
function localUrl(path){const u=new URL(path,location.href);if(u.origin!==location.origin||!['http:','https:'].includes(u.protocol))throw Error('Invalid asset URL');return u.href}
function render(){cards.replaceChildren();const q=search.value.toLowerCase();const selected=packs.filter(p=>(!kind.value||p.kind===kind.value)&&[p.title,p.author,p.id].some(v=>String(v).toLowerCase().includes(q)));status.textContent=selected.length+(selected.length===1?' pack':' packs');for(const p of selected){const article=document.createElement('article'),img=document.createElement('img'),body=document.createElement('div'),tag=document.createElement('small'),title=document.createElement('h2'),meta=document.createElement('div'),link=document.createElement('a');img.src=localUrl(p.preview_url);img.alt=p.title;img.loading='lazy';body.className='body';tag.textContent=p.kind;title.textContent=p.title;meta.className='meta';meta.textContent=`By ${p.author} · ${p.licence} · v${p.version}`;link.textContent='Download pack ↓';link.href=localUrl(p.url);link.download='';body.append(tag,title,meta,link);article.append(img,body);cards.append(article)}}
search.addEventListener('input',render);kind.addEventListener('change',render);fetch('index.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(index=>{if(index.schema!=='guo/store-index@1'||!Array.isArray(index.packs))throw Error('Unsupported index');packs=index.packs;render()}).catch(()=>status.textContent='The collection could not be loaded. Please try again.');
</script></html>
