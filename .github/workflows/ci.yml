name: CI

on:
  push:
    branches: [main, "work/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks that need no toolchain: nothing proprietary and nothing
  # machine-specific may ever be committed.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No UO client data
        run: |
          hits=$(git ls-files | grep -iE '\.(mul|uop|idx|def|enu|cliloc)$|(^|/)cliloc\.' || true)
          if [ -n "$hits" ]; then
            echo "::error::Client data is proprietary and must never be committed:"
            echo "$hits"
            exit 1
          fi

      - name: No personal paths outside docs
        run: |
          hits=$(git grep -nE '[A-Za-z]:[\\/](Users|_uo|Games)[\\/]' -- . ':!docs' || true)
          if [ -n "$hits" ]; then
            echo "::error::Machine paths belong in launchers/_shared/config.local.bat (gitignored):"
            echo "$hits"
            exit 1
          fi

      - name: No LAN address, personal email or home folder
        run: python3 tools/privacy_scan/run.py

      - name: Documentation links and anchors
        run: |
          python3 tools/docs_lint/test_docs_lint.py
          python3 tools/docs_lint/run.py

      - name: Configuration resolution
        run: python3 tools/guo/test_config.py

      - name: Agent request queue
        run: python3 tools/agent_queue/test_agent_queue.py

      - name: Web export guard (never the official Godot, never wipes the last build)
        run: python3 tools/web/test_run.py

      - name: No local config committed
        run: |
          if git ls-files --error-unmatch launchers/_shared/config.local.bat 2>/dev/null; then
            echo "::error::config.local.bat is per-machine and must stay untracked"
            exit 1
          fi

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The client compiles against upstream's cuoapi.dll, and the audit and
      # guoasset read upstream sources, so fetch ClassicUO at the reviewed pin.
      - name: Read upstream pin
        id: pin
        shell: pwsh
        run: |
          $pin = Get-Content docs/upstream/UPSTREAM_PIN.json | ConvertFrom-Json
          if ($pin.commit -notmatch '^[0-9a-f]{40}$') { throw "UPSTREAM_PIN commit is not a sha" }
          if ($pin.repo -notmatch '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$') { throw "UPSTREAM_PIN repo is not a GitHub URL" }
          "repo=$($pin.repo)" >> $env:GITHUB_OUTPUT
          "commit=$($pin.commit)" >> $env:GITHUB_OUTPUT

      - name: Cache upstream
        id: upstream-cache
        uses: actions/cache@v6
        with:
          path: sources/ClassicUO
          key: classicuo-${{ steps.pin.outputs.commit }}-recursive

      - name: Fetch upstream
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          UPSTREAM_REPO: ${{ steps.pin.outputs.repo }}
          UPSTREAM_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          git init -q sources/ClassicUO
          cd sources/ClassicUO
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the client
        run: dotnet build godot/GUO/GUO.csproj -c Release --nologo

      - name: Build guoasset
        run: dotnet build tools/guoasset/GUO.AssetMcp.csproj -c Release --artifacts-path build/guoasset --nologo

      - name: Python tools compile
        run: python -m compileall -q tools

      # Every ported file that differs from upstream (at the pin fetched
      # above) must say why, with // PORT DEVIATION (GUO): (AGENTS.md rule 2).
      - name: Port drift is marked
        run: python tools/port_drift/run.py --strict

      # The Asset Store end to end: publish, serve, install with the C#
      # installer, verify hashes, update and uninstall (ADR-0019).
      # test_corpus.py runs the Python publisher and the C# installer over the
      # same folder of malformed packs; they must agree (S6).
      # test_store.py runs the web page's JavaScript under Node's built-ins.
      # test_content.py checks v2 content packs in both languages, and
      # test_catalogue.py the signed catalogue indexes (ADR-0026), and
      # test_shard_content.py a shard's descriptor, deployed and installed;
      # they use the headless C# build smoke.py makes.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Asset Store tests and smoke
        run: |
          python tools/asset_store/test_store.py
          python tools/asset_store/test_corpus.py
          python tools/asset_store/smoke.py
          python tools/asset_store/test_content.py
          python tools/asset_store/test_catalogue.py
          python tools/shard_content/test_shard_content.py

      # Bulk unpack/pack of art, gumps and animations (Epic H, H2), on a
      # synthetic install: codecs, unpack -> pack byte identity, edits, new art.
      - name: uopack tests
        run: |
          python -m pip install --quiet pillow
          python tools/uopack/test_uopack.py

      # Authoring UO data files (ADR-0022): the staged set, the free scanners,
      # the range policy, the append-only writers and the read-back, on tiny
      # synthetic files made at test time. No client data.
      - name: UO data writer tests
        run: python tools/uodata_write/test_uodata.py

      # docs/port_status.md is generated. If it differs from a fresh audit
      # (ignoring its timestamp), someone ported without re-measuring.
      - name: Port audit is current
        shell: bash
        run: |
          python tools/port_audit/run.py --out build/port_status.md
          if ! diff <(grep -v '^- \*\*Generated:' docs/port_status.md) \
                    <(grep -v '^- \*\*Generated:' build/port_status.md); then
            echo "::error::docs/port_status.md is stale. Run launchers\\pipeline\\03_port_audit.bat and commit it."
            exit 1
          fi
