; One pooled run over every Python test folder under tools/: launchers/dev/pytest_all.bat / .sh.
; importlib: no folder is put on sys.path by pytest; conftest.py gives each folder its own path and modules.
; no:randomly: pytest-randomly, where installed, reseeds through entry points that import thinc, which
;   finds tools/asset_store/catalogue.py instead of its own `catalogue`; the order is also kept fixed.
; Script-only test files (no test_* functions) collect nothing and keep running as scripts:
;   tools/multi/test_multi.py and test_gen.py, tools/web/test_run.py, tools/asset_store/test_corpus.py
;   (builds the C# verifier) and tools/editor_smoke/test_stage_validation.py (needs the Godot editor).
[pytest]
addopts = --import-mode=importlib -p no:randomly
testpaths = tools
norecursedirs = .* __pycache__ build bin obj src node_modules fixtures golden godot godot_web
